<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手機版理財記賬助手</title>
    <link rel="stylesheet" href="style.css?v=2.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="phone-container">
        
        <!-- 【第一頁：首頁清單】 -->
        <div id="page-1" class="page-content active">
            <header class="page-header-flex">
                <div>
                    <h1>理財導航首頁</h1>
                    <p>歡迎回來，這是您的 5 階段理財計劃</p>
                </div>
                <div class="header-btns">
                    <button onclick="toggleMenu()" class="badge menu-trigger" style="cursor: pointer; border: 1px solid var(--card-border); background-color: var(--card-bg);">📋 選單</button>
                </div>
            </header>
            <div class="page-1-list">
                <div onclick="switchPage(2)" class="morandi-card">
                    <h3>第二頁：記賬功能</h3>
                    <p>記錄日常支出、檢視當月花費</p>
                </div>
                <div onclick="switchPage(3)" class="morandi-card">
                    <h3>第三頁：理財階段一 (預留)</h3>
                    <p>點擊切換至下階段討論</p>
                </div>
                <div onclick="switchPage(4)" class="morandi-card">
                    <h3>第四頁：理財階段二 (預留)</h3>
                    <p>點擊切換至下階段討論</p>
                </div>
                <div onclick="switchPage(5)" class="morandi-card">
                    <h3>第五頁：理財階段三 (預留)</h3>
                    <p>點擊切換至下階段討論</p>
                </div>
            </div>
        </div>

        <!-- 【第二頁：記賬頁面】 -->
        <div id="page-2" class="page-content">
            <header class="page-header-flex">
                <div>
                    <h1>日常記賬</h1>
                    <p>掌握您的消費流向</p>
                </div>
                <div class="header-btns">
                    <button onclick="resetAppData()" class="badge" style="cursor: pointer; border: 1px solid var(--card-border); background-color: var(--card-bg);">🔄 重新整理</button>
                    <button onclick="toggleMenu()" class="badge menu-trigger" style="cursor: pointer; border: 1px solid var(--card-border); background-color: var(--card-bg);">📋 選單</button>
                </div>
            </header>
            
            <div class="balance-card">
                <span>當前總支出</span>
                <h2 id="total-balance">$ 0</h2>
            </div>

            <div class="morandi-card form-card">
                <h3>新增支出</h3>
                <form id="expense-form" onsubmit="addTransaction(event)" class="form-group">
                    <input type="text" id="desc" placeholder="項目說明(例如: 晚餐，可不填)" class="form-input">
                    <div class="form-row">
                        <select id="category" class="form-input half">
                            <optgroup label="住房">
                                <option value="房租">住房 - 房租</option>
                                <option value="水電">住房 - 水電</option>
                                <option value="住房其他">住房 - 其他</option>
                            </optgroup>
                            <optgroup label="飲食">
                                <option value="食材">飲食 - 食材</option>
                                <option value="外食">飲食 - 外食</option>
                                <option value="點心">飲食 - 點心</option>
                            </optgroup>
                            <optgroup label="交通">
                                <option value="大眾運輸">交通 - 大眾運輸</option>
                                <option value="打車">交通 - 打車</option>
                                <option value="油錢">交通 - 油錢</option>
                            </optgroup>
                            <optgroup label="生活用品">
                                <option value="耐用品">生活 - 耐用品</option>
                                <option value="消耗品">生活 - 消耗品</option>
                            </optgroup>
                            <optgroup label="通訊">    
                                <option value="話費">通訊 - 話費</option>
                                <option value="訂閱">通訊 - 訂閱</option>
                            </optgroup> 
                            <optgroup label="娛樂">
                                <option value="旅遊">娛樂 - 旅遊</option>
                                <option value="社交">娛樂 - 社交</option>
                                <option value="娛樂其他">娛樂 - 其他</option>
                            </optgroup>
                            <optgroup label="教育">
                                <option value="課程">教育 - 課程</option>
                                <option value="書籍">教育 - 書籍</option>
                                <option value="教育其他">教育 - 其他</option>
                            </optgroup>
                            <option value="保險">保險</option>
                        </select>
                        <input type="number" id="amount" placeholder="金額" required class="form-input half">
                    </div>
                    <button type="submit" class="btn-submit">新增紀錄</button>
                </form>
            </div>

            <div class="chart-container">
                <canvas id="expenseChart"></canvas>
            </div>

            <!-- 獨立一格的支出明細區塊 -->
            <div class="transaction-section">
                <div class="transaction-header" onclick="toggleTransactionBox()" style="cursor: pointer;">
                    <h3>支出明細</h3>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span id="transaction-count" style="font-size: 0.75rem; color: var(--text-sub);">共 0 筆</span>
                        <span id="toggle-text" style="font-size: 0.75rem; color: var(--accent); font-weight: 500;">展開</span>
                    </div>
                </div>
                <!-- 明細列表容器，預設加上 .collapsed 隱藏 -->
                <div id="transaction-list" class="transaction-scroll-box collapsed">
                    <p class="empty-text">目前尚無記賬資料</p>
                </div>
            </div>
        </div>

        <!-- 【第三頁：理財階段一】 -->
        <div id="page-3" class="page-content">
            <header class="page-header-flex">
                <div><h1>理財階段一</h1></div>
                <button onclick="toggleMenu()" class="badge menu-trigger" style="cursor: pointer; border: 1px solid var(--card-border); background-color: var(--card-bg);">📋 選單</button>
            </header>
            <div class="morandi-card stage-card"><p>💡 階段討論中...</p></div>
        </div>

        <!-- 【第四頁：理財階段二】 -->
        <div id="page-4" class="page-content">
            <header class="page-header-flex">
                <div><h1>理財階段二</h1></div>
                <button onclick="toggleMenu()" class="badge menu-trigger" style="cursor: pointer; border: 1px solid var(--card-border); background-color: var(--card-bg);">📋 選單</button>
            </header>
            <div class="morandi-card stage-card"><p>💡 階段討論中...</p></div>
        </div>

        <!-- 【第五頁：理財階段三】 -->
        <div id="page-5" class="page-content">
            <header class="page-header-flex">
                <div><h1>理財階段三</h1></div>
                <button onclick="toggleMenu()" class="badge menu-trigger" style="cursor: pointer; border: 1px solid var(--card-border); background-color: var(--card-bg);">📋 選單</button>
            </header>
            <div class="morandi-card stage-card"><p>💡 階段討論中...</p></div>
        </div>

        <!-- 全域彈出式導航選單 (Modal) -->
        <div id="nav-modal" class="nav-modal-overlay" onclick="toggleMenu()">
            <div class="nav-modal-content" onclick="event.stopPropagation()">
                <h3>快速導航選單</h3>
                <button onclick="switchPage(1); toggleMenu();">🏠 理財導航首頁</button>
                <button onclick="switchPage(2); toggleMenu();">📊 每日日常記賬</button>
                <button onclick="switchPage(3); toggleMenu();">🎯 理財階段一</button>
                <button onclick="switchPage(4); toggleMenu();">🎯 理財階段二</button>
                <button onclick="switchPage(5); toggleMenu();">🎯 理財階段三</button>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
