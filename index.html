<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手機版理財記賬助手</title>
    <!-- 引入獨立的 CSS 樣式表 -->
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="phone-container">
        
        <!-- 【第一頁：首頁清單】 -->
        <div id="page-1" class="page-content active">
            <header>
                <h1>理財導航首頁</h1>
                <p>歡迎回來，這是您的 5 階段理財計劃</p>
            </header>
            <div class="page-1-list">
                <div onclick="switchPage(2)" class="morandi-card">
                    <h3>第二頁：記賬功能 (現正使用)</h3>
                    <p>記錄日常支出、檢視當月花費</p>
                </div>
                <div onclick="switchPage(3)" class="morandi-card">
                    <h3>第三頁：理財階段一 (預留)</h3>
                    <p>點擊切換至下階段討論</p>
                </div>
                <div onclick="switchPage(4)" class="morandi-card">
                    <h3>第四頁：理財階段二 (預留)</h3>
                    <p>點擊切換至下階段討論</p>
                </div>
                <div onclick="switchPage(5)" class="morandi-card">
                    <h3>第五頁：理財階段三 (預留)</h3>
                    <p>點擊切換至下階段討論</p>
                </div>
            </div>
        </div>

        <!-- 【第二頁：記賬頁面】 -->
        <div id="page-2" class="page-content">
            <header class="page-header-flex">
                <div>
                    <h1>日常支出記賬</h1>
                    <p>掌握您的消費流向</p>
                </div>
                <span class="badge">記賬模式</span>
            </header>
            
            <!-- 總支出總覽卡片 -->
            <div class="balance-card">
                <span>當前總支出</span>
                <h2 id="total-balance">$ 0</h2>
            </div>


            <!-- 新增記賬表單 -->
            <div class="morandi-card form-card">
                <h3>新增支出</h3>
                <form id="expense-form" onsubmit="addTransaction(event)" class="form-group">
                    <input type="text" id="desc" placeholder="項目說明(例如: 晚餐，可不填)" class="form-input">
                    <div class="form-row">
                        <select id="category" class="form-input half">
                            <option value="餐飲">餐飲</option>
                            <option value="交通">交通</option>
                            <option value="娛樂">娛樂</option>
                            <option value="其他">其他</option>
                        </select>
                        <input type="number" id="amount" placeholder="金額" required class="form-input half">
                    </div>
                    <button type="submit" class="btn-submit">新增紀錄</button>
                </form>
            </div>
            <!-- 圓餅圖顯示區塊 -->
            <div class="chart-container">
                <canvas id="expenseChart"></canvas>
            </div>

            <!-- 獨立一格的支出明細區塊 -->
            <div class="transaction-section">
                <div class="transaction-header">
                    <h3>支出明細</h3>
                    <span id="transaction-count" style="font-size: 0.75rem; color: var(--text-sub);">共 0 筆</span>
                </div>
                <!-- 專屬的明細列表容器 -->
                <div id="transaction-list" class="transaction-scroll-box">
                    <p class="empty-text">目前尚無記賬資料</p>
                </div>
            </div>
        </div>

        <!-- 【第三頁：理財階段一】 -->
        <div id="page-3" class="page-content">
            <header><h1>理財階段一</h1></header>
            <div class="morandi-card stage-card"><p>💡 階段討論中...</p></div>
        </div>

        <!-- 【第四頁：理財階段二】 -->
        <div id="page-4" class="page-content">
            <header><h1>理財階段二</h1></header>
            <div class="morandi-card stage-card"><p>💡 階段討論中...</p></div>
        </div>

        <!-- 【第五頁：理財階段三】 -->
        <div id="page-5" class="page-content">
            <header><h1>理財階段三</h1></header>
            <div class="morandi-card stage-card"><p>💡 階段討論中...</p></div>
        </div>

        <!-- 底部固定導覽列 -->
        <nav>
            <button onclick="switchPage(1)" id="nav-btn-1" class="nav-btn active"><span>首頁</span></button>
            <button onclick="switchPage(2)" id="nav-btn-2" class="nav-btn"><span>記賬</span></button>
            <button onclick="switchPage(3)" id="nav-btn-3" class="nav-btn"><span>階段1</span></button>
            <button onclick="switchPage(4)" id="nav-btn-4" class="nav-btn"><span>階段2</span></button>
            <button onclick="switchPage(5)" id="nav-btn-5" class="nav-btn"><span>階段3</span></button>
        </nav>
    </div>

    <!-- 引入獨立的 JavaScript 邏輯檔 -->
    <script src="script.js"></script>
</body>
</html>
